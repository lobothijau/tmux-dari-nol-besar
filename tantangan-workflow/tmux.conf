# tmux dari Nol — konfigurasi final (Modul 7–8)
# https://kodepas.com/kelas/tmux-dari-nol-besar
#
# Pasang: cp tmux.conf ~/.tmux.conf && tmux source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

set -g mouse on
set -g history-limit 50000
setw -g mode-keys vi

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -s escape-time 0
set -g focus-events on

bind r source-file ~/.tmux.conf \; display-message "tmux.conf di-reload"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1c1917,fg=#e7e5e4"
set -g status-left " #[bold]#S "
set -g status-left-length 24
set -g status-right " %Y-%m-%d %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W* "
setw -g window-status-current-style "bg=#f59e0b,fg=#1c1917,bold"
