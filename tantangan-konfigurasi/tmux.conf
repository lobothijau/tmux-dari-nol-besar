# Tantangan konfigurasi — ~/.tmux.conf minimal
# https://kodepas.com/kelas/tmux-dari-nol-besar/tantangan-konfigurasi

set -g mouse on
set -g history-limit 50000
setw -g mode-keys vi

# Split vertikal yang lebih mudah diingat daripada %
bind | split-window -h -c "#{pane_current_path}"

# Reload tanpa keluar sesi: prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf di-reload"
